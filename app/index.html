<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon Cabinet — par CICTNA RDC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Archivo:wght@600;700&family=Amiri:wght@400;700&family=Tinos:wght@400;700&family=Dancing+Script:wght@600&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="icon" type="image/png" href="icone.png"/>
</head>
<body>

<!-- ═════════ CONNEXION ═════════ -->
<div id="login" class="login">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-stethoscope"></i></div>
    <h1 id="login-hello">Bonjour Docteur</h1>
    <p class="login-sub">Tapez votre code pour ouvrir le cabinet</p>
    <div class="pin-dots" id="pin-dots"><span></span><span></span><span></span><span></span></div>
    <p class="login-error" id="login-error" aria-live="polite"></p>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="key-alt" aria-label="Effacer"><i class="fa-solid fa-delete-left"></i></button>
      <button data-k="0">0</button>
      <button data-k="ok" class="key-ok" aria-label="Entrer"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <p class="login-demo hidden" id="login-demo"><i class="fa-solid fa-circle-info"></i> Version de démonstration : le code est <strong>1 2 3 4</strong></p>
  </div>
  <p class="credit">Conçu et développé par <a href="https://cictnardc.net" target="_blank" rel="noopener">CICTNA RDC</a></p>
</div>

<!-- ═════════ APPLICATION ═════════ -->
<div id="app" class="app hidden">
  <header class="topbar">
    <a class="brand" href="#/accueil"><i class="fa-solid fa-stethoscope"></i><span>Mon Cabinet</span></a>
    <nav class="nav">
      <a href="#/accueil" data-nav="accueil"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
      <a href="#/patients" data-nav="patients"><i class="fa-solid fa-users"></i><span>Patients</span></a>
      <a href="#/agenda" data-nav="agenda"><i class="fa-solid fa-calendar-days"></i><span>Agenda</span></a>
      <a href="#/reglages" data-nav="reglages"><i class="fa-solid fa-gear"></i><span>Réglages</span></a>
    </nav>
    <div class="topbar-tools">
      <div class="textsize" role="group" aria-label="Taille du texte">
        <button id="text-minus" title="Texte plus petit">A<sup>−</sup></button>
        <button id="text-plus" title="Texte plus grand">A<sup>+</sup></button>
      </div>
      <button class="btn-quit" id="btn-quit" title="Fermer la session"><i class="fa-solid fa-lock"></i><span>Fermer</span></button>
    </div>
  </header>
  <div class="demo-banner hidden" id="demo-banner"><i class="fa-solid fa-flask"></i> Démonstration · patients fictifs · rien n'est envoyé nulle part</div>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<!-- Fenêtre de confirmation -->
<div id="dialog" class="dialog-back hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <h2 id="dialog-title">Confirmer</h2>
    <div id="dialog-body"></div>
    <div class="dialog-actions" id="dialog-actions"></div>
  </div>
</div>

<div id="toast" class="toast hidden" aria-live="polite"></div>

<!-- Zone d'impression (ordonnances, certificats) -->
<div id="print-area"></div>

<script src="demo-data.js"></script>
<script src="app.js"></script>
<script src="documents.js"></script>
</body>
</html>
